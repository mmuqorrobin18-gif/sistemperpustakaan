<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Perpustakaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef1f6;--card:#fff;--tx:#16203a;--mut:#5b6580;--pri:#1d2b4f;--pri-tx:#fff;--pri2:#e3e9f6;--acc:#f2b134;--hd:#1d2b4f;--bd:#dbe1ee;--bad:#b42318;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#e8ecf7;--mut:#9aa6c4;--pri:#a9c0ff;--pri-tx:#0e1424;--pri2:#212c4b;--hd:#0a0f1e;--bd:#28345a;--bad:#f97066}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1424;--card:#172038;--tx:#e8ecf7;--mut:#9aa6c4;--pri:#a9c0ff;--pri-tx:#0e1424;--pri2:#212c4b;--hd:#0a0f1e;--bd:#28345a;--bad:#f97066}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh,64px) + 10px)}
body{margin:0;padding-top:var(--hh,64px);background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--hd);position:fixed;top:0;left:0;right:0;z-index:15;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 12px rgba(0,0,0,.22)}
.bar{max-width:1040px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.brand{order:1}
.navw{order:2;margin-left:auto}
.who{order:3;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.82);font-size:13px;white-space:nowrap}
.who span{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.who .out{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:6px 13px;font:600 13px var(--sans);cursor:pointer}
.who .out:hover{background:rgba(255,255,255,.26)}
header.two .brand{flex:1}
header.two .who{order:2}
header.two .navw{order:3;flex:1 1 100%;margin-left:0}
.brand{font:700 18px var(--serif);color:#fff;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand img{height:32px;width:auto;border-radius:6px}
.mark{display:inline-block;width:20px;height:26px;border-radius:3px 5px 5px 3px;background:linear-gradient(90deg,var(--acc) 0 6px,#fff 6px)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;max-width:100%}
nav::-webkit-scrollbar{display:none}
.navw{display:flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.navw nav{position:relative}
.nb{display:none;flex:none;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font:700 20px/1 var(--sans);cursor:pointer;padding:0;align-items:center;justify-content:center}
.navw.hasov .nb{display:flex}
.nb:hover{background:rgba(255,255,255,.26)}
.nb:disabled{opacity:.3;cursor:default}
@media (max-width:860px){.brand{flex:1}.who{order:2}.navw{order:3;flex:1 1 100%;margin-left:0}}
nav a{padding:7px 10px;border-radius:99px;color:rgba(255,255,255,.78);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap}
nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
nav a.on{background:var(--acc);color:#1d2b4f;font-weight:700}
main{max-width:1040px;margin:auto;padding:22px 16px 56px}
h1{font:700 30px/1.15 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
h2{font:600 19px/1.25 var(--serif);margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 18px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stats .card{margin:0}
.stat{border-left:4px solid var(--acc)}
.stat b{display:block;font:700 30px/1.1 var(--serif);color:var(--pri)}
.stat span{color:var(--mut);font-size:13px}
input,select,textarea,button{font:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,monospace}
label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-bottom:5px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.btn{background:var(--pri);color:var(--pri-tx);border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.s{background:var(--pri2);color:var(--pri)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.btn.m{padding:6px 11px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--pri2);color:var(--pri)}
.tag.no{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--mut) transparent;background-color:var(--card);background-image:linear-gradient(to right,var(--card) 30%,transparent),linear-gradient(to left,var(--card) 30%,transparent),radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.22),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.22),transparent);background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll}
.tw::-webkit-scrollbar{height:8px}
.tw::-webkit-scrollbar-thumb{background:var(--mut);border-radius:8px}
.swipe{margin:0 0 6px;font-size:12px;color:var(--mut);text-align:right}
.pager{position:sticky;left:0;max-width:calc(100vw - 72px);margin-top:12px}
.pg{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mut)}
.pgc{display:flex;align-items:center;gap:8px}
.pgn{font-weight:600;color:var(--tx);white-space:nowrap}
.pgh{display:none;width:100%;margin:0;font-size:12px}
@media (hover:none){.pgh{display:block}}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;accent-color:var(--pri);vertical-align:middle;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;background:var(--pri2);color:var(--pri);font-weight:600;font-size:13px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:hover td{background:var(--bg)}
.late{color:var(--bad);font-weight:600}
.err{color:var(--bad);margin:10px 0 0;font-size:14px}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.bar2{height:8px;background:var(--acc);border-radius:4px}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login{max-width:410px;margin:28px auto;border-top:5px solid var(--acc)}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dlg{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:20px;max-width:380px;width:100%}
.hero{background:var(--hd);color:#fff;border-radius:18px;overflow:hidden;margin-bottom:22px}
.hero-in{padding:30px 26px 22px}
.hero-logo{height:56px;width:auto;border-radius:8px;margin-bottom:14px;background:#fff;padding:4px}
.hero h1{font-size:clamp(26px,5vw,40px);max-width:18ch;margin-bottom:10px;color:#fff}
.hero p{margin:0 0 18px;color:rgba(255,255,255,.78);max-width:52ch}
.hero-search{display:flex;gap:8px;flex-wrap:wrap}
.hero-search input,.hero-search select{background:#fff;color:#16203a;border:0;border-radius:10px;padding:14px 15px;font-size:16px}
.hero-search input{flex:2 1 240px;width:auto}
.hero-search select{flex:1 1 170px;width:auto}
.hero p.hero-meta{margin:14px 0 0;font-size:14px}
.hero-meta b{color:var(--acc)}
.spines{display:flex;align-items:flex-end;gap:4px;height:78px;padding:0 26px}
.spines i{flex:1;max-width:44px;border-radius:3px 3px 0 0;background:hsl(var(--h) 42% 46%);border-top:4px solid hsl(var(--h) 50% 62%)}
.shelf{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.book{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.cover{position:relative;min-height:180px;padding:44px 16px 16px 26px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(90deg,hsl(var(--h) 40% 17%) 0 11px,hsl(var(--h) 38% 30%) 11px)}
.cover h3{font:600 19px/1.2 var(--serif);margin:0 0 6px;color:#fff}
.cover p{margin:0;font-size:13px;opacity:.85}
.ct{position:absolute;top:12px;left:26px;font-size:12px;background:rgba(255,255,255,.16);padding:2px 9px;border-radius:99px}
.bmeta{padding:12px 14px 14px;display:grid;gap:5px;justify-items:start}
.bmeta p{margin:0;font-size:13px;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;padding:44px 16px;color:var(--mut)}
.empty b{display:block;font:600 18px var(--serif);color:var(--tx);margin-bottom:4px}
.kl{max-height:260px;overflow:auto;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.kit{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;margin:0;color:var(--tx);font-size:14px}
.kit input{flex:none}
.kit span{display:grid}.kit small{color:var(--mut);font-size:12px}
.pr{overflow-x:auto}
.kgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,85.6mm)}
.kc{width:85.6mm;height:54mm;border-radius:3mm;overflow:hidden;background:#fff;color:#16203a;border:1px solid #cfd6e6;display:flex;flex-direction:column;font-family:var(--sans);break-inside:avoid}
.kh{background:#1d2b4f;color:#fff;padding:3mm 4mm;border-bottom:1.2mm solid #f2b134}
.kb{display:flex;align-items:center;gap:2.5mm}
.kb img{height:8mm;width:auto;border-radius:1mm;background:#fff;padding:.5mm}
.kb b{display:block;font:700 4.2mm/1.1 var(--serif)}
.kb small{font-size:2.6mm;opacity:.8}
.kb .mark{width:5mm;height:7mm}
.kbd{flex:1;padding:2mm 4mm 0;display:flex;align-items:center;justify-content:space-between;gap:3mm}
.ktx{min-width:0}
.kq{flex:none;width:24mm;height:24mm}
.kq svg{display:block;width:100%;height:100%}
.kn{font:700 5mm/1.15 var(--serif);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kn.s{font-size:3.8mm}
.kno{font:700 4mm/1.2 ui-monospace,monospace;color:#1d2b4f;margin-top:1.5mm;letter-spacing:.3mm}
.km{font-size:3.2mm;color:#5b6580;margin-top:1mm}
.kf{display:flex;justify-content:space-between;padding:1.5mm 4mm 2.5mm;font-size:2.4mm;color:#5b6580}
.rptp{display:none}
.rt{width:100%;border-collapse:collapse;font-size:9pt;margin:2mm 0 4mm}
.rt th,.rt td{border:1px solid #bbc3d6;padding:1.2mm 2mm;text-align:left;white-space:normal}
.rt th{background:#e3e9f6;color:#16203a}
#bkp .rt td:nth-child(2),#bkp .rt td:nth-child(n+4){white-space:nowrap}
@media print{
  @page{size:A4;margin:12mm}
  @page kartu{size:A4;margin:7mm}
  @page buku{size:A4 landscape;margin:10mm}
  html,body{background:#fff!important;padding:0!important;color:#16203a}
  header,.swipe,.pager,.ov{display:none!important}
  body[data-pg=kartu] #app>*{display:none!important}
  body[data-pg=kartu] #app>.pr{display:block!important;border:0!important;padding:0!important;overflow:visible!important;background:#fff!important;page:kartu}
  body[data-pg=kartu] .pr>:not(.kgrid){display:none!important}
  body[data-pg=kartu] .kgrid{grid-template-columns:repeat(2,85.6mm)!important;gap:3mm 6mm!important;justify-content:center}
  body[data-pg=laporan] #app>*{display:none!important}
  body[data-pg=buku] #app>*,body[data-pg=kunjungan] #app>*{display:none!important}
  body[data-pg=laporan] #app>.rptp,body[data-pg=buku] #app>.rptp,body[data-pg=kunjungan] #app>.rptp{display:block!important}
  body[data-pg=buku] #app>.rptp{page:buku}
  .rptp h1{font:700 18pt var(--serif);margin:0 0 1mm;color:#16203a}
  .rptp h2{font:600 11.5pt var(--serif);margin:5mm 0 1mm;break-after:avoid;color:#1d2b4f}
  .rptp p{margin:0 0 3mm;color:#5b6580}
  .rptp ol{margin:1mm 0 0;padding-left:5mm}
  .rh{border-bottom:2mm solid #f2b134;margin-bottom:3mm}
  .rt tr{break-inside:avoid}
  .kh,.kb .mark,.rt th,.rh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand" id="brand"></div><div class="navw"><button class="nb" id="nl" aria-label="Geser menu ke kiri">‹</button><nav id="nav"></nav><button class="nb" id="nr" aria-label="Geser menu ke kanan">›</button></div><div class="who" id="who"></div></div></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5,today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},addDays=(d,n)=>new Date(new Date(d).getTime()+n*DAY).toISOString().slice(0,10);
const seed=[['Laskar Pelangi','Andrea Hirata','Novel',2005,'9789793062792',3,'A1'],['Bumi Manusia','Pramoedya Ananta Toer','Novel',1980,'9789799731234',2,'A2'],['Atomic Habits','James Clear','Pengembangan Diri',2018,'9780735211292',2,'B1'],['Sapiens','Yuval Noah Harari','Sejarah',2011,'9780062316097',2,'C1'],['Matematika Kelas X','Kemendikbud','Pelajaran',2021,'9786022823001',5,'D1'],['Biologi Kelas XI','Kemendikbud','Pelajaran',2021,'9786022823002',4,'D2'],['Filosofi Teras','Henry Manampiring','Pengembangan Diri',2018,'9786024241031',3,'B2'],['Negeri 5 Menara','Ahmad Fuadi','Novel',2009,'9789792248074',2,'A3']].map((r,i)=>({id:'b'+(i+1),judul:r[0],penulis:r[1],kategori:r[2],penerbit:['Bentang Pustaka','Lentera Dipantara','Gramedia','KPG','Kemendikbud','Kemendikbud','Kompas','Bentang Pustaka'][i],isbn:r[4],stok:r[5],kode:'BK-'+String(i+1).padStart(3,'0')}));
const defUsers={admin:{role:'admin',nama:'Admin',pw:'admin123',kode:'ADM-2026'},kepala:{role:'kepala',nama:'Kepala Perpustakaan',pw:'kepala123',kode:'KPL-2026'}};
let libName=load('lib_name','Perpustakaan'),dashName=load('lib_dash','Dashboard'),logo=load('lib_logo',''),visits=load('lib_visits',[]),books=load('lib_books',seed),loans=load('lib_loans',[]),members=load('lib_members',[]),users=load('lib_users',defUsers),me=null,q='',kat='',editId=null,editUser=null,editVisit=null,rMonth='',rAll=false,msg='';
books.forEach(b=>{if(b.penerbit==null)b.penerbit='';if(b.kode==null)b.kode=b.rak||''});try{me=sessionStorage.getItem('lib_me')}catch(e){}
const U=()=>me&&users[me];
const ROLE={admin:'Admin',kepala:'Kepala Perpustakaan',staf:'Staf Perpustakaan',duta:'Duta Perpustakaan'},NAMA={dashboard:'Dashboard',buku:'Kelola Buku',anggota:'Anggota',kartu:'Kartu Anggota',pinjam:'Peminjaman',reservasi:'Reservasi',kunjungan:'Kunjungan',denda:'Kelola Denda',laporan:'Laporan',pengurus:'Kelola Pengurus',pengaturan:'Pengaturan'},ACCESS={admin:['dashboard','buku','anggota','kartu','pinjam','reservasi','kunjungan','denda','laporan','pengurus','pengaturan'],kepala:['dashboard','buku','anggota','kartu','pinjam','reservasi','kunjungan','denda','laporan','pengaturan'],staf:['dashboard','buku','anggota','kartu','pinjam','reservasi','kunjungan','denda','pengaturan'],duta:['dashboard','pinjam','reservasi','kunjungan','pengaturan']};
const avail=b=>b.stok-loans.filter(l=>l.bookId===b.id&&!l.tglKembali).length-resv.filter(r=>r.bookId===b.id&&resLive(r)).length;
const bk=id=>books.find(b=>b.id===id);
const sv=()=>{save('lib_books',books);save('lib_loans',loans);save('lib_members',members);save('lib_resv',resv);save('lib_visits',visits);save('lib_kas',kasTx);save('lib_users',users)};
const $=s=>document.querySelector(s);

function route(){
  let h=(location.hash||'#katalog').slice(1);const u=U();
  if(['dashboard','buku','anggota','kartu','pinjam','reservasi','kunjungan','denda','laporan','pengurus','pengaturan'].includes(h)&&!u)h='masuk';
  if(u&&h!=='katalog'&&!(ACCESS[u.role]||[]).includes(h))h='dashboard';
  if(h==='masuk'&&u)h='dashboard';
  const items=[['katalog','Katalog']];
  if(u){(ACCESS[u.role]||['dashboard']).forEach(k=>items.push([k,k==='dashboard'?esc(dashName||'Dashboard'):NAMA[k]]))}
  else items.push(['masuk','Masuk Staf']);
  $('#brand').innerHTML=(logo?`<img src="${logo}" alt="Logo">`:'<i class="mark"></i>')+'<span>'+esc(libName||'Perpustakaan')+'</span>';document.title=libName||'Perpustakaan';document.body.dataset.pg=h;$('#nav').innerHTML=items.map(i=>`<a href="#${i[0]}" class="${i[0]===h?'on':''}">${i[1]}</a>`).join('');$('#who').innerHTML=u?`<span>${esc(u.nama)}</span><button type="button" class="out" onclick="logout()">Keluar</button>`:'';document.querySelector('header').classList.toggle('two',!!u);
  $('#app').innerHTML=({katalog:vKatalog,masuk:vMasuk,dashboard:vDash,buku:vBuku,anggota:vAnggota,kartu:vKartu,pinjam:vPinjam,reservasi:vReservasi,kunjungan:vKunjungan,denda:vDenda,pengurus:vPengurus,laporan:vLaporan,pengaturan:vSet})[h]();
  if(h==='katalog')list();if(h==='kartu')kList();if(h==='pinjam')initPinjam();if(h==='kunjungan')visList();qmap={};['bkT','anT','actT','hisT','dnT','kasT','rsT'].forEach(applyRows);hintSwipe();navActive();hdrH();
}
window.addEventListener('hashchange',()=>{pgmap={};route()});

/* KATALOG (umum) */
function vKatalog(){
  const cats=[...new Set(books.map(b=>b.kategori))].sort();
  const tot=books.reduce((a,b)=>a+Number(b.stok),0),ava=books.reduce((a,b)=>a+avail(b),0);
  const spines=[62,88,48,96,70,56,84,44,92,66,52,78,90,60,74,50].map((h,i)=>`<i style="height:${h}%;--h:${(i*47+20)%360}"></i>`).join('');

/* IMPOR MASSAL */
function parseRows(t){
  const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(!lines.length)return[];
  const h=lines[0],d=h.includes('\t')?'\t':(h.split(';').length>h.split(',').length?';':',');
  return lines.map(l=>{const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){o.push(c.trim());c=''}else c+=ch}o.push(c.trim());return o});
}
function readFile(inp,ta){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(ta).value=r.result};r.readAsText(f)}
function bulkCard(id,fn,cols,ex){
  return `<div class="card"><h2>Tambah massal</h2><p class="sub" style="margin-bottom:8px">Tempel data dari Excel atau Google Sheets (satu baris satu data), atau unggah file .csv. Urutan kolom: <b>${cols}</b>.</p><div style="margin-bottom:8px"><input type="file" accept=".csv,.txt,.tsv" onchange="readFile(this,'#${id}')"></div><textarea id="${id}" rows="6" placeholder="${ex}"></textarea><div class="flex" style="margin-top:8px"><button class="btn" onclick="${fn}()">Impor</button></div><p class="note">${esc(msg)}</p></div>`;
}
function bulkDone(n,sk,what,why){msg=n+' '+what+' ditambahkan'+(sk?', '+sk+' dilewati ('+why+').':'.');sv();route();msg=''}
function bulkBooks(){
  const rows=parseRows($('#bb').value);if(rows.length&&/^judul/i.test(rows[0][0]))rows.shift();
  let n=0,sk=0;
  rows.forEach(r=>{
    const isbn=r[4]||'';
    if(!r[0]||(isbn&&books.some(b=>String(b.isbn)===isbn))){sk++;return}
    books.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,6),judul:r[0],penulis:r[1]||'-',kategori:r[2]||'Umum',penerbit:r[3]||'-',isbn,stok:Math.max(1,+r[5]||1),kode:r[6]||'-'});n++;
  });
  bulkDone(n,sk,'buku','judul kosong atau ISBN sudah ada');
}
function bulkMembers(){
  const rows=parseRows($('#bm').value);if(rows.length&&/^nama/i.test(rows[0][0]))rows.shift();
  const has=no=>members.some(m=>m.no.toLowerCase()===no.toLowerCase());
  let n=0,sk=0;
  rows.forEach(r=>{
    let no=r[1]||'';
    if(!r[0]||(no&&has(no))){sk++;return}
    if(!no){let i=members.length+1;do{no='AGT-'+String(i++).padStart(3,'0')}while(has(no))}
    members.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,6),nama:r[0],no,kelas:r[2]||'',tgl:today()});n++;
  });
  bulkDone(n,sk,'anggota','nama kosong atau nomor anggota sudah ada');
}

/* FILTER JUMLAH TAMPILAN */
var pgSize=+load('lib_pg',10)||10,qmap={},pgmap={};
const pgSelect=()=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:0;white-space:nowrap">Tampilkan<select style="width:auto" onchange="setPg(this.value)">${[10,25,50,100].map(n=>`<option ${n===pgSize?'selected':''}>${n}</option>`).join('')}</select>baris</label>`;
function setPg(v){pgSize=[10,25,50,100].includes(+v)?+v:10;save('lib_pg',pgSize);pgmap={};route()}
const pagerHtml=(id,pg,pages,total,a,b)=>`<div class="pg"><span>Menampilkan ${a}–${b} dari ${total} data</span>${pages>1?`<div class="pgc"><button type="button" class="btn s m" ${pg<=1?'disabled':''} onclick="goPg('${id}',${pg-1})" aria-label="Halaman sebelumnya">‹ Sebelumnya</button><span class="pgn">Halaman ${pg} dari ${pages}</span><button type="button" class="btn s m" ${pg>=pages?'disabled':''} onclick="goPg('${id}',${pg+1})" aria-label="Halaman berikutnya">Berikutnya ›</button></div><p class="pgh">Di ponsel, geser tabel ke kiri atau kanan sampai ujung untuk pindah halaman.</p>`:''}</div>`;
function goPg(id,n){pgmap[id]=n;applyRows(id)}
function applyRows(id){
  const t=document.getElementById(id);if(!t)return;
  const q=qmap[id]||'';
  const rows=[...t.querySelectorAll('tr')].slice(1).filter(r=>!r.querySelector('td[colspan]'));
  const hit=rows.filter(r=>!q||r.textContent.toLowerCase().includes(q));
  const pages=Math.max(1,Math.ceil(hit.length/pgSize)),pg=Math.min(Math.max(1,pgmap[id]||1),pages);
  pgmap[id]=pg;
  const from=(pg-1)*pgSize,to=from+pgSize,show=new Set(hit.slice(from,to));
  rows.forEach(r=>{const v=show.has(r);r.style.display=v?'':'none';const c=r.querySelector('.ck');if(c&&!v)c.checked=false});
  let n=t.parentNode.querySelector('.pager[data-t="'+id+'"]');
  if(!n){n=document.createElement('div');n.className='pager';n.dataset.t=id;t.after(n)}
  n.innerHTML=hit.length?pagerHtml(id,pg,pages,hit.length,from+1,Math.min(to,hit.length)):'';
  ckUpd(id);
}
function filterRows(inp,id){qmap[id]=inp.value.toLowerCase();pgmap[id]=1;applyRows(id)}

/* GESER UNTUK PINDAH HALAMAN */
(function(){
  let st=null;
  document.addEventListener('touchstart',e=>{
    const t=e.target.closest('table[id]');
    if(!t||!document.querySelector('.pager[data-t="'+t.id+'"]')){st=null;return}
    const sc=t.closest('.tw'),x=e.touches[0];
    st={id:t.id,x:x.clientX,y:x.clientY,l:sc.scrollLeft<=2,r:sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-2};
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!st)return;const c=e.changedTouches[0],dx=c.clientX-st.x,dy=c.clientY-st.y,k=st;st=null;
    if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
    const pg=pgmap[k.id]||1;
    if(dx<0&&k.r)goPg(k.id,pg+1);else if(dx>0&&k.l)goPg(k.id,pg-1);
  },{passive:true});
})();

/* PILIH MASSAL */

/* QR CODE (byte mode, koreksi galat M, versi 1-6) */
function qrMatrix(text){
  const bytes=[...new TextEncoder().encode(String(text))];
  const CAP=[16,28,44,64,86,108],ECC=[10,16,26,18,24,16],BLK=[1,1,1,2,2,4];
  let v=0;while(v<6&&bytes.length>CAP[v]-2)v++;
  if(v>=6)return null;
  const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));
  const capBits=CAP[v]*8;
  put(0,Math.min(4,capBits-bits.length));
  while(bits.length%8)bits.push(0);
  for(let pad=0xEC;bits.length<capBits;pad^=0xEC^0x11)put(pad,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const rs=(d,n)=>{const g=new Array(n).fill(0);g[n-1]=1;let r=1;
    for(let i=0;i<n;i++){for(let j=0;j<n;j++){g[j]=mul(g[j],r);if(j+1<n)g[j]^=g[j+1]}r=mul(r,2)}
    const rem=new Array(n).fill(0);
    for(const b of d){const f=b^rem.shift();rem.push(0);g.forEach((c,i)=>{rem[i]^=mul(c,f)})}
    return rem};
  const nb=BLK[v],bl=CAP[v]/nb,blocks=[],eccs=[];
  for(let i=0;i<nb;i++){const d=data.slice(i*bl,(i+1)*bl);blocks.push(d);eccs.push(rs(d,ECC[v]))}
  const all=[];
  for(let i=0;i<bl;i++)blocks.forEach(b=>all.push(b[i]));
  for(let i=0;i<ECC[v];i++)eccs.forEach(e=>all.push(e[i]));
  const size=21+4*v,M=[],F=[];
  for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
    const x=cx+dx,y=cy+dy,d=Math.max(Math.abs(dx),Math.abs(dy));
    if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(v>=1){const c=size-7;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(c+dx,c+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
  const fmt=mask=>{
    const d=mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
    const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));
    set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));
    for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));
    for(let i=8;i<15;i++)set(8,size-15+i,g(i));
    set(8,size-8,true)};
  fmt(0);
  let k=0;
  for(let right=size-1;right>=1;right-=2){
    if(right===6)right=5;
    for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){
      const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
      if(!F[y][x]&&k<all.length*8){M[y][x]=((all[k>>>3]>>>(7-(k&7)))&1)===1;k++}}}
  const mf=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,
    (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,
    (x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&mf[m](x,y))M[y][x]=!M[y][x]};
  const pen=()=>{let p=0;
    for(let t=0;t<2;t++)for(let a=0;a<size;a++){let run=1,prev=null;
      for(let b=0;b<size;b++){const c=t?M[b][a]:M[a][b];
        if(c===prev){run++;if(run===5)p+=3;else if(run>5)p++}else{run=1;prev=c}}}
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];
      if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
    let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));
    return p+(Math.ceil(Math.abs(dark*20-size*size*10)/(size*size))-1)*10};
  let best=0,bp=1e9;
  for(let m=0;m<8;m++){apply(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m}apply(m)}
  apply(best);fmt(best);
  return M;
}
function qrSvg(text){
  const m=qrMatrix(text);if(!m)return '';
  const n=m.length;let d='';
  m.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+='M'+(x+4)+' '+(y+4)+'h1v1h-1z'}));
  return `<svg viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="Kode QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#16203a"/></svg>`;
}

/* UNDUH PDF KARTU */
async function kPdf(){
  const sel=members.filter(m=>kSel.has(m.id));if(!sel.length)return;
  if(!window.PDFLib){ask('Pustaka PDF belum termuat. Periksa koneksi internet, lalu muat ulang halaman.');return}
  const {PDFDocument,StandardFonts,rgb}=window.PDFLib,mm=72/25.4,pw=210*mm,ph=297*mm,cw=85.6*mm,ch=54*mm;
  const doc=await PDFDocument.create();
  const fs=await doc.embedFont(StandardFonts.TimesRomanBold),fr=await doc.embedFont(StandardFonts.Helvetica),fm=await doc.embedFont(StandardFonts.CourierBold);
  let img=null;if(logo){try{img=await doc.embedPng(logo)}catch(e){}}
  const ink=rgb(.114,.169,.31),gold=rgb(.949,.694,.208),tx=rgb(.086,.125,.227),mut=rgb(.357,.396,.502),white=rgb(1,1,1);
  const safe=t=>String(t==null?'':t).replace(/[^\x20-\x7E\xA0-\xFF]/g,'?');
  const fit=(t,font,size,min,max)=>{let z=size;while(z>min&&font.widthOfTextAtSize(t,z)>max)z-=.5;return z};
  const nameLines=(t,font,max)=>{
    let z=13;while(z>9&&font.widthOfTextAtSize(t,z)>max)z-=.5;
    if(font.widthOfTextAtSize(t,z)<=max)return{l:[t],z};
    const w=t.split(' ');let best=null;
    for(let i=1;i<w.length;i++){const l=[w.slice(0,i).join(' '),w.slice(i).join(' ')],mw=Math.max(...l.map(q=>font.widthOfTextAtSize(q,10)));if(!best||mw<best.mw)best={mw,l}}
    const l=best?best.l:[t];let z2=10;
    while(z2>6&&Math.max(...l.map(q=>font.widthOfTextAtSize(q,z2)))>max)z2-=.5;
    return{l,z:z2}};
  const gx=(pw-(2*85.6+6)*mm)/2,gy=(ph-(5*54+4*3)*mm)/2;
  let page=null;
  sel.forEach((m,i)=>{
    const k=i%10;if(k===0)page=doc.addPage([pw,ph]);
    const x=gx+(k%2)*(85.6+6)*mm,top=ph-gy-Math.floor(k/2)*(54+3)*mm,y=top-ch;
    page.drawRectangle({x,y,width:cw,height:ch,color:white,borderColor:rgb(.81,.84,.9),borderWidth:.7});
    page.drawRectangle({x,y:top-12*mm,width:cw,height:12*mm,color:ink});
    page.drawRectangle({x,y:top-13.2*mm,width:cw,height:1.2*mm,color:gold});
    let x0=x+4*mm;
    if(img){const h=8*mm,w=Math.min(img.width*h/img.height,16*mm);
      page.drawRectangle({x:x0-.6*mm,y:top-10.6*mm,width:w+1.2*mm,height:h+1.2*mm,color:white});
      page.drawImage(img,{x:x0,y:top-10*mm,width:w,height:h});x0+=w+3*mm}
    const ln=safe(libName||'Perpustakaan');page.drawText(ln,{x:x0,y:top-6.4*mm,size:fit(ln,fs,11,6,cw-(x0-x)-4*mm),font:fs,color:white});
    page.drawText('Kartu Anggota',{x:x0,y:top-9.6*mm,size:6.5,font:fr,color:rgb(.85,.88,.95)});
    const qs=22*mm,qx=x+cw-4*mm-qs,qy=top-17*mm-qs,maxW=qx-(x+4*mm)-5*mm;
    const nm=nameLines(safe(m.nama),fs,maxW),two=nm.l.length>1,ny=two?21.5:24;
    nm.l.forEach((ln,j)=>page.drawText(ln,{x:x+4*mm,y:top-(ny+j*4)*mm,size:nm.z,font:fs,color:tx}));
    const no=safe(m.no);
    page.drawText(no,{x:x+4*mm,y:top-(two?31:30)*mm,size:fit(no,fm,10.5,7,maxW),font:fm,color:ink});
    if(m.kelas){const kl=safe(m.kelas);page.drawText(kl,{x:x+4*mm,y:top-(two?35.5:34.5)*mm,size:fit(kl,fr,8,5.5,maxW),font:fr,color:mut})}
    const q=qrMatrix(m.no);
    if(q){const n=q.length,c=qs/n;
      for(let r=0;r<n;r++)for(let cc=0;cc<n;cc++)if(q[r][cc])page.drawRectangle({x:qx+cc*c,y:qy+qs-(r+1)*c,width:c+.12,height:c+.12,color:tx})}
    const tg=m.tgl?m.tgl.split('-').reverse().join('/'):'',wt='Wajib dibawa saat meminjam';
    page.drawText('Bergabung '+tg,{x:x+4*mm,y:y+3*mm,size:6,font:fr,color:mut});
    page.drawText(wt,{x:x+cw-4*mm-fr.widthOfTextAtSize(wt,6),y:y+3*mm,size:6,font:fr,color:mut});
  });
  await savePdf(await doc.save(),'kartu-anggota.pdf');
}

var kSel=new Set(),kq='';

function vKartu(){

function kList(){

  const r=members.filter(kMatch);

function kTog(c){if(c.checked)kSel.add(c.value);else kSel.delete(c.value);kPrev()}

function kCard(m){

function kPrev(){

/* DIALOG KONFIRMASI */
function ask(t,fn,lbl,alt){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="dlg"><p style="margin:0 0 14px">${esc(t)}</p><div class="flex" style="justify-content:flex-end"><button class="btn s" id="no">${fn?'Batal':'Tutup'}</button>${alt?`<button class="btn s" id="alt">${esc(alt.lbl)}</button>`:''}${fn?`<button class="btn" id="yes" ${lbl?'':'style="background:var(--bad)"'}>${lbl||'Ya, hapus'}</button>`:''}</div></div>`;
  document.body.appendChild(o);
  o.querySelector('#no').onclick=()=>o.remove();
  if(alt)o.querySelector('#alt').onclick=()=>{o.remove();alt.fn()};
  if(fn)o.querySelector('#yes').onclick=()=>{o.remove();fn()};
}

}
function pinjam(e){e.preventDefault();const f=e.target;loans.push({id:'l'+Date.now(),bookId:f.b.value,peminjam:f.n.value.trim(),tglPinjam:today(),jatuhTempo:addDays(today(),+f.d.value||7),tglKembali:''});sv();route()}
function kembali(id){
  const l=loans.find(x=>x.id===id);if(!l)return;
  const d=Math.max(0,dayDiff(l.jatuhTempo,today())),f=d*fineRate,jd=bk(l.bookId)?bk(l.bookId).judul:'buku';
  const done=paid=>{
    l.tglKembali=today();l.dendaHari=d;l.denda=f;
    if(f>0){l.lunas=!!paid;if(paid){l.dibayar=f;l.tglBayar=today();l.ketKas='Denda keterlambatan '+jd}}
    sv();msg=!f?'Buku dikembalikan tepat waktu, tanpa denda.':'Buku dikembalikan. Denda '+rp(f)+' ('+d+' hari x '+rp(fineRate)+'), '+(paid?'sudah dibayar dan masuk kas.':'belum dibayar. Catat pembayarannya di menu Kelola Denda.');
    route();msg='';
  };
  if(f>0)ask(l.peminjam+' terlambat '+d+' hari. Denda '+rp(f)+' ('+d+' hari x '+rp(fineRate)+'). Apakah denda dibayar sekarang?',()=>done(true),'Kembalikan, denda lunas',{lbl:'Kembalikan, belum bayar',fn:()=>done(false)});
  else done(false);
}

var fineRate=(v=>Number.isFinite(v)&&v>=0?v:500)(Number(load('lib_fine',500)));

function rank(list,key){
  const g={};list.forEach(x=>{const k=key(x);g[k]=(g[k]||0)+1});
  return Object.entries(g).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));

function months(){

  loans.forEach(l=>{set.add(l.tglPinjam.slice(0,7));if(l.tglKembali)set.add(l.tglKembali.slice(0,7))});
  visits.forEach(v=>set.add(v.tgl.slice(0,7)));

}
function repData(m){

  const pr=Object.values(g).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n)).map(x=>({...x,kelas:(mm[x.n]&&mm[x.n].kelas)||'-'}));
  const bt=l=>bk(l.bookId)?bk(l.bookId).judul:'(buku sudah dihapus)';

async function saveBytes(bytes,name,mime){
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(!dl){
    if(window.APP_CONFIG){const u=URL.createObjectURL(new Blob([bytes],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}
    ask('Unduhan langsung tidak tersedia di tampilan ini. Buka halaman ini di tab sendiri lalu pakai tombol Cetak dan pilih Simpan sebagai PDF.');return}
  try{await dl.save({filename:name,data:bytes})}
  catch(e){if(!e||e.code!=='declined')ask('Berkas belum bisa disimpan'+(e&&e.code?' (kode: '+e.code+')':'')+'. Coba lagi, atau pakai tombol Cetak dan pilih Simpan sebagai PDF.')}
}

/* LAPORAN KUNJUNGAN */
var kFrom='',kTo='';
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const hariOf=t=>HARI[new Date(t+'T00:00:00').getDay()];
const dec1=x=>(Math.round(x*10)/10).toFixed(1).replace('.',',');
function kunRange(){
  const t=today();let f=kFrom||t.slice(0,7)+'-01',e=kTo||t;
  if(f>e){const x=f;f=e;e=x}
  return[f,e];
}
function kunRep(){
  const [f,e]=kunRange(),V=visits.filter(v=>v.tgl>=f&&v.tgl<=e).sort((a,b)=>a.tgl.localeCompare(b.tgl)||a.id.localeCompare(b.id));
  const mm={};members.forEach(m=>mm[(m.nama+' ('+m.no+')').toLowerCase()]=m);
  const isM=v=>!!mm[v.n.toLowerCase()],byDay={};
  V.forEach(v=>{byDay[v.tgl]=(byDay[v.tgl]||0)+1});
  const days=Object.keys(byDay).sort(),mem=V.filter(isM).length,span=Math.max(1,dayDiff(f,e)+1);
  return{f,e,V,mm,isM,byDay,days,mem,tamu:V.length-mem,span,uniq:new Set(V.map(v=>v.n.toLowerCase())).size,top:rank(V,v=>v.n)};
}
function kunStats(){
  const r=kunRep(),st=(n,t)=>`<div class="card stat"><b>${n}</b><span>${t}</span></div>`;
  return st(r.V.length,'Total kunjungan')+st(r.uniq,'Pengunjung berbeda')+st(r.mem,'Kunjungan anggota')+st(r.tamu,'Kunjungan tamu');
}
function kunPrintHtml(){

function addVisit(e){
  e.preventDefault();const n=e.target.n.value.trim(),t=today(),say=s=>{msg=s;route();msg=''};

      if(tgl>t){say('Tanggal tidak boleh lebih dari hari ini.');return}

  if(tgl>t){say('Tanggal kunjungan tidak boleh lebih dari hari ini.');return}

}

function saveKas(e){

  const cur=editKas?kasTx.find(k=>k.id===editKas):null;
  if(editKas&&(!cur||!['admin','kepala'].includes(role))){editKas=null;route();return}

function resCek(){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="dlg" style="max-width:440px"><h2 style="margin:0 0 8px">Reservasi saya</h2><label>Nomor anggota</label><div class="flex" style="margin-bottom:8px"><input id="rn" placeholder="Contoh: AGT-001" autocomplete="off" style="flex:1;width:auto"><button class="btn" id="go">Cek</button></div><div id="rl"></div><div class="flex" style="justify-content:flex-end;margin-top:12px"><button class="btn s" id="no">Tutup</button></div></div>`;
  document.body.appendChild(o);
  const inp=o.querySelector('#rn'),rl=o.querySelector('#rl'),go=o.querySelector('#go');inp.focus();
  o.querySelector('#no').onclick=()=>o.remove();
  const show=()=>{
    const m=findMember(inp.value);
    if(!m){rl.innerHTML='<p class="err" style="margin:0">Nomor anggota tidak terdaftar.</p>';return}
    const L=resv.filter(r=>r.no===m.no&&resLive(r));
    rl.innerHTML=`<p class="note" style="margin:0 0 8px">Atas nama ${esc(maskName(m.nama))}</p>`+(L.length?L.map(r=>`<div class="flex" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(r.kode)}</b> ${esc(bk(r.bookId)?bk(r.bookId).judul:'-')}<br><small class="note">Ambil sebelum ${fmtD(r.batas)}</small></span><button class="btn d m" data-id="${r.id}">Batalkan</button></div>`).join(''):'<p class="sub" style="margin:0">Tidak ada reservasi aktif.</p>');
    rl.querySelectorAll('button[data-id]').forEach(bt=>{bt.onclick=()=>{
      const r=resv.find(x=>x.id===bt.dataset.id);
      if(r&&r.no===m.no&&resLive(r)){r.status='Dibatalkan';r.tglProses=today();sv();show();if($('#list'))list()}
    }});
  };
  go.onclick=show;inp.onkeydown=e=>{if(e.key==='Enter')show()};
}
function vReservasi(){
  const cnt=s=>resv.filter(r=>resStat(r)===s).length,st=(n,t,c)=>`<div class="card stat"><b${c?' style="color:var(--bad)"':''}>${n}</b><span>${t}</span></div>`;
  const rows=resv.filter(r=>!rsStatus||resStat(r)===rsStatus).sort((a,b)=>b.tgl.localeCompare(a.tgl)||b.kode.localeCompare(a.kode));
  const opt=v=>`<option value="${v}" ${rsStatus===v?'selected':''}>${v||'Semua status'}</option>`;
  return `<h1>Reservasi</h1><p class="sub">Reservasi buku dari anggota lewat katalog. Buku ditahan ${resDays} hari. Proses menjadi peminjaman saat anggota datang mengambil.</p>
  <p class="note" style="margin:0 0 10px">${esc(msg)}</p>
  <div class="stats">${st(cnt('Menunggu'),'Menunggu diambil')}${st(cnt('Kedaluwarsa'),'Kedaluwarsa',cnt('Kedaluwarsa')>0)}${st(cnt('Dipinjam'),'Sudah dipinjam')}${st(cnt('Dibatalkan'),'Dibatalkan')}</div>
  <div class="card tw"><h2>Daftar reservasi (${rows.length})</h2>
    <div class="flex" style="margin-bottom:8px"><select style="width:auto" onchange="rsStatus=this.value;route()" aria-label="Status reservasi">${['','Menunggu','Kedaluwarsa','Dipinjam','Dibatalkan'].map(opt).join('')}</select><input placeholder="Cari kode, nama, nomor anggota, atau buku…" oninput="filterRows(this,'rsT')" style="flex:1 1 200px;width:auto">${pgSelect()}</div>
    <table id="rsT"><tr><th></th><th>Kode</th><th>Tanggal</th><th>Anggota</th><th>Buku</th><th>Ambil sebelum</th><th>Status</th></tr>${rows.map(r=>{const s=resStat(r),act=s==='Menunggu'||s==='Kedaluwarsa';
      return `<tr><td>${act?`<button class="btn m" onclick="resProc('${r.id}')">Proses pinjam</button> <button class="btn d m" onclick="resBatal('${r.id}')">Batalkan</button>`:''}</td><td><b>${esc(r.kode)}</b></td><td>${fmtD(r.tgl)}</td><td>${esc(r.nama)} (${esc(r.no)})</td><td>${esc(bk(r.bookId)?bk(r.bookId).judul:'(buku sudah dihapus)')}</td><td>${fmtD(r.batas)}</td><td><span class="tag ${s==='Dipinjam'||s==='Menunggu'?'':'no'}">${s}</span></td></tr>`}).join('')||'<tr><td colspan="7">Belum ada reservasi.</td></tr>'}</table></div>`;
}
function resProc(id){
  const r=resv.find(x=>x.id===id);if(!r||r.status!=='Menunggu')return;
  const b=bk(r.bookId);if(!b){ask('Buku untuk reservasi ini sudah tidak ada di katalog.');return}
  if(resStat(r)==='Kedaluwarsa'&&avail(b)<=0){ask('Reservasi ini sudah kedaluwarsa dan buku kini tidak tersedia.');return}
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="dlg"><h2 style="margin:0 0 8px">Proses menjadi peminjaman</h2><p style="margin:0 0 10px"><b>${esc(b.judul)}</b><br>${esc(r.nama)} (${esc(r.no)})</p><label>Lama pinjam (hari)</label><input id="lp" type="number" min="1" max="60" value="7" style="margin-bottom:14px"><div class="flex" style="justify-content:flex-end"><button class="btn s" id="no">Batal</button><button class="btn" id="yes">Catat peminjaman</button></div></div>`;
  document.body.appendChild(o);o.querySelector('#no').onclick=()=>o.remove();
  o.querySelector('#yes').onclick=()=>{
    const d=Math.max(1,Math.min(60,parseInt(o.querySelector('#lp').value,10)||7));o.remove();
    r.status='Dipinjam';r.tglProses=today();
    loans.push({id:'l'+Date.now(),bookId:b.id,peminjam:r.nama+' ('+r.no+')',tglPinjam:today(),jatuhTempo:addDays(today(),d),tglKembali:''});
    sv();msg='Reservasi '+r.kode+' diproses. Peminjaman dicatat selama '+d+' hari.';route();msg='';
  };
}
function resBatal(id){
  const r=resv.find(x=>x.id===id);if(!r||r.status!=='Menunggu')return;
  ask('Batalkan reservasi '+r.kode+' atas nama '+r.nama+'?',()=>{r.status='Dibatalkan';r.tglProses=today();sv();msg='Reservasi '+r.kode+' dibatalkan.';route();msg=''},'Ya, batalkan');
}
function resCard(){
  return `<div class="card"><h2>Reservasi buku</h2><p class="sub" style="margin-bottom:10px">Lama buku ditahan untuk anggota yang mereservasi lewat katalog. Setiap anggota dapat memiliki maksimal ${RES_MAX} reservasi aktif.</p><form onsubmit="setResDays(event)"><div class="row"><div><label>Masa tahan (hari)</label><input name="rd" type="number" min="1" max="14" step="1" value="${resDays}" required></div></div><button class="btn">Simpan</button></form></div>`;
}
function setResDays(e){
  e.preventDefault();if(!['admin','kepala'].includes((U()||{}).role))return;
  const v=parseInt(e.target.rd.value,10);if(!(v>=1&&v<=14))return;
  resDays=v;save('lib_resdays',v);msg='Masa tahan reservasi disimpan: '+v+' hari. Berlaku untuk reservasi berikutnya.';route();msg='';
}

/* TARIF DENDA */
function fineCard(){
  return `<div class="card"><h2>Denda keterlambatan</h2><p class="sub" style="margin-bottom:10px">Denda dihitung per hari keterlambatan sejak jatuh tempo. Perubahan tarif hanya berlaku untuk pengembalian berikutnya.</p><form onsubmit="setFine(event)"><div class="row"><div><label>Denda per hari (Rp)</label><input name="fr" type="number" min="0" max="1000000" step="100" value="${fineRate}" required></div></div><button class="btn">Simpan tarif</button></form></div>`;
}
function setFine(e){
  e.preventDefault();if(!['admin','kepala'].includes((U()||{}).role))return;
  const v=parseInt(e.target.fr.value,10);if(!(v>=0))return;
  fineRate=v;save('lib_fine',v);msg='Tarif denda disimpan: '+rp(v)+' per hari.';route();msg='';
}

/* CADANGAN DATA */
function dataObj(){return{versi:1,dibuat:today(),pengaturan:{libName,dashName,logo,fineRate,resDays},buku:books,pinjam:loans,anggota:members,kunjungan:visits,kas:kasTx,reservasi:resv}}
function backupCard(){
  return `<div class="card"><h2>Cadangan data</h2><p class="sub" style="margin-bottom:10px">Unduh seluruh data (buku, anggota, peminjaman, kunjungan, kas, reservasi, dan pengaturan) sebagai berkas JSON. Berkas ini juga bisa diimpor ke versi online.</p><div class="flex"><button class="btn" onclick="exportData()">Unduh cadangan (JSON)</button>${U().role==='admin'?'<label class="btn s" style="margin:0;cursor:pointer">Impor dari berkas<input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)"></label>':''}</div></div>`;
}
async function exportData(){await saveBytes(new TextEncoder().encode(JSON.stringify(dataObj())),'cadangan-perpustakaan-'+today()+'.json','application/json')}
function importData(inp){
  const f=inp.files&&inp.files[0];if(!f||U().role!=='admin')return;
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){ask('Berkas tidak bisa dibaca. Pastikan ini berkas cadangan JSON dari aplikasi ini.');return}
    const L=['buku','pinjam','anggota','kunjungan','kas','reservasi'];
    if(!d||typeof d!=='object'||!L.some(k=>Array.isArray(d[k]))){ask('Isi berkas tidak sesuai format cadangan perpustakaan.');return}
    const n=k=>Array.isArray(d[k])?d[k].filter(o=>o&&o.id).length:0;
    ask('Impor '+n('buku')+' buku, '+n('anggota')+' anggota, '+n('pinjam')+' peminjaman, '+n('kunjungan')+' kunjungan, '+n('kas')+' transaksi kas, dan '+n('reservasi')+' reservasi? Data dengan ID yang sama akan ditimpa.',()=>{
      const merge=(cur,inc)=>{const m=new Map(cur.map(o=>[o.id,o]));(Array.isArray(inc)?inc:[]).forEach(o=>{if(o&&o.id)m.set(o.id,o)});return[...m.values()]};
      books=merge(books,d.buku);loans=merge(loans,d.pinjam);members=merge(members,d.anggota);visits=merge(visits,d.kunjungan);kasTx=merge(kasTx,d.kas);resv=merge(resv,d.reservasi);
      books.forEach(b=>{if(b.penerbit==null)b.penerbit='';if(b.kode==null)b.kode=b.rak||''});
      const p=d.pengaturan||{};
      if(typeof p.libName==='string'&&p.libName){libName=p.libName;save('lib_name',libName)}
      if(typeof p.dashName==='string'&&p.dashName){dashName=p.dashName;save('lib_dash',dashName)}
      if(typeof p.logo==='string'){logo=p.logo;save('lib_logo',logo)}
      if(Number.isFinite(Number(p.fineRate))&&p.fineRate!==null){fineRate=Number(p.fineRate);save('lib_fine',fineRate)}
      if(Number.isFinite(Number(p.resDays))&&Number(p.resDays)>=1){resDays=Number(p.resDays);save('lib_resdays',resDays)}
      sv();msg='Data berhasil diimpor.';route();msg='';
    },'Ya, impor');
    inp.value='';
  };
  r.readAsText(f);
}

/* NAMA TAMPILAN */
function nameCard(){
  return `<div class="card"><h2>Nama tampilan</h2><p class="sub" style="margin-bottom:10px">Nama perpustakaan tampil di bagian atas halaman dan kartu anggota. Judul dashboard tampil di menu dan di halaman dashboard.</p><form onsubmit="setNames(event)"><div class="row"><div><label>Nama perpustakaan</label><input name="ln" value="${esc(libName)}" maxlength="40" required></div><div><label>Judul dashboard</label><input name="dn" value="${esc(dashName)}" maxlength="24" required></div></div><div class="flex"><button class="btn">Simpan nama</button><button type="button" class="btn s" onclick="resetNames()">Kembalikan ke awal</button></div></form></div>`;
}
function setNames(e){
  e.preventDefault();if(!['admin','kepala'].includes((U()||{}).role))return;
  const f=e.target;libName=f.ln.value.trim()||'Perpustakaan';dashName=f.dn.value.trim()||'Dashboard';
  save('lib_name',libName);save('lib_dash',dashName);msg='Nama tampilan tersimpan.';route();msg='';
}
function resetNames(){
  if(!['admin','kepala'].includes((U()||{}).role))return;
  libName='Perpustakaan';dashName='Dashboard';save('lib_name',libName);save('lib_dash',dashName);msg='Nama tampilan dikembalikan ke awal.';route();msg='';
}

/* LOGO */
function setLogo(inp){
  const f=inp.files[0];if(!f)return;
  const say=t=>{msg=t;route();msg=''};
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){say('File harus berupa gambar PNG, JPG, atau WEBP.');return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{const s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      logo=c.toDataURL('image/png');save('lib_logo',logo);say('Logo tersimpan.')};
    im.onerror=()=>say('Gambar tidak dapat dibaca.');im.src=r.result};
  r.readAsDataURL(f);
}
function delLogo(){logo='';save('lib_logo','');route()}

/* PENGATURAN (kepala) */
function vSet(){
  const blk=(k,t)=>`<div class="card"><h2>${t}</h2><form onsubmit="setCred(event,'${k}')"><div class="row"><div><label>Kata sandi baru</label><input name="pw" type="password" required></div></div><button class="btn">Simpan</button></form></div>`;
  return `<h1>Pengaturan</h1><p class="sub">Atur nama tampilan, logo, dan kata sandi.</p><p class="note" style="margin:0 0 10px">${esc(msg)}</p>${!['admin','kepala'].includes(U().role)?'':nameCard()}${!['admin','kepala'].includes(U().role)?'':fineCard()}${!['admin','kepala'].includes(U().role)?'':resCard()}${!['admin','kepala'].includes(U().role)?'':backupCard()}${!['admin','kepala'].includes(U().role)?'':`<div class="card"><h2>Logo perpustakaan</h2><p class="sub" style="margin-bottom:10px">Logo tampil di bagian atas semua halaman dan di halaman awal katalog. Gunakan gambar PNG, JPG, atau WEBP.</p>${logo?`<div style="margin-bottom:10px"><img src="${logo}" alt="Logo saat ini" style="max-height:90px;max-width:100%"></div>`:''}<div class="flex"><input type="file" accept="image/png,image/jpeg,image/webp" onchange="setLogo(this)">${logo?'<button class="btn d m" onclick="delLogo()">Hapus logo</button>':''}</div></div>`}${blk(me,'Akun Saya')}`;
}
function setCred(e,k){e.preventDefault();users[k].pw=e.target.pw.value;sv();msg='Tersimpan untuk '+users[k].nama+'.';route();msg=''}
route();
</script>
